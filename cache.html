<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Playstation Hub - Caching</title>
    <meta name="author" content="ArabPixel">
    <link rel="stylesheet" href="./includes/css/cache.css">
</head>

<body>
    <main class="mainContainer">
        <section class="cache-screen">
            <div class="cache-title">Caching Playstation Hub</div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="cache-subtitle" id="cacheStatus">Preparing...</div>
        </section>
        <div class="absolute bottom-10">Firmware-Based Caching System &middot; Hub 1.3 / cache v7</div>
    </main>

    <iframe id="cacheFrame" src="about:blank"></iframe>

    <script src="./includes/js/storage.js"></script>
    <script src="./includes/js/testMode.js"></script>
    <script src="./includes/js/firmware.js"></script>
    <script>
        var fwVersion = getPs4FwVersion();
        var targetPage = getCachePage(fwVersion);

        var statusEl = document.getElementById('cacheStatus');
        statusEl.style.whiteSpace = 'normal';
        var fillEl = document.getElementById('progressFill');
        var frame = document.getElementById('cacheFrame');

        // Listen for postMessages from the iframe (iframe_cache.js)
        window.addEventListener('message', function (event) {
            var data = event.data;
            if (!data || !data.type) return;

            if (data.type === 'CACHE_PROGRESS') {
                if (data.percent >= 0) {
                    fillEl.style.width = data.percent + '%';
                    statusEl.textContent = 'Downloading... ' + data.percent + '%';
                } else {
                    statusEl.textContent = 'Downloading... (' + data.loaded + ' of ' + data.total + ')';
                }
            } else if (data.type === 'CACHE_COMPLETE' || data.type === 'CACHE_EXISTS') {
                fillEl.style.width = '100%';
                statusEl.innerHTML = (data.type === 'CACHE_EXISTS' ? 'Already cached! Redirecting...' : 'Done! Redirecting...') +
                    '<br><br><a href="' + mainPage + '">Continue to Playstation Hub</a>';
                setTimeout(function () {
                    try { sessionStorage.removeItem('hubCacheRedirect'); } catch (e) {}
                    // This page itself lives inside the AppCache. A redirect can be
                    // swallowed by the cache, so leave through the parent/opener if we
                    // are not the top window, and fall back to location.replace.
                    try {
                        if (window.top && window.top !== window) {
                            window.top.location.replace(mainPage);
                            return;
                        }
                    } catch (e) {}
                    window.location.replace(mainPage);
                }, 1000);
            } else if (data.type === 'CACHE_CHECKING') {
                statusEl.textContent = 'Checking cache...';
            } else if (data.type === 'CACHE_DOWNLOADING') {
                statusEl.textContent = 'Caching files...';
            } else if (data.type === 'CACHE_DIAGNOSING') {
                statusEl.textContent = 'AppCache reported an error. Checking which files are missing...';
            } else if (data.type === 'CACHE_ERROR') {
                var reason = data.reason || 'Unknown error';
                var details = '';
                if (data.broken && data.broken.length) {
                    details = '<br><br>Not reachable:<br>' + data.broken.slice(0, 15).join('<br>');
                }
                statusEl.innerHTML = 'Cache error: ' + reason + details +
                    '<br><br><a href="' + mainPage + '">Continue without offline cache</a>';
                // Kein automatischer Sprung: sonst sieht man die Ursache nicht.
            }
        }, false);

        // Load the firmware-based cache page into the hidden iframe
        statusEl.textContent = 'Starting cache for firmware ' + (fwVersion || 'unknown') + '...';
        frame.src = targetPage;

        // Safety net: if the iframe never reports anything, do not sit here forever.
        var gotMessage = false;
        window.addEventListener('message', function () { gotMessage = true; }, false);
        setTimeout(function () {
            if (gotMessage) return;
            statusEl.innerHTML = 'No answer from the cache page.<br><br>' +
                '<a href="' + mainPage + '">Continue without offline cache</a>';
        }, 20000);
    </script>
</body>

</html>
