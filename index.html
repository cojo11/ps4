<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PS-Exploit Hub</title>
    <style>
        body { background-color: #0b0d10; color: #ffffff; font-family: sans-serif; text-align: center; padding-top: 5vh; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); padding-bottom: 30px; }
        h1 { color: #0078ff; font-weight: 400; }
        .countdown { font-size: 18px; color: #ff9d00; font-weight: bold; margin: 20px 0; background: rgba(255, 157, 0, 0.1); padding: 10px; border-radius: 6px; display: inline-block; }
        .fw-detect { font-size: 14px; color: #7fd0a0; font-weight: bold; margin: 10px 0; }
        .credits-box { text-align: left; margin-top: 20px; padding: 15px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; border-left: 4px solid #0078ff; }
        ul { list-style-type: none; padding-left: 0; }
        li { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .dev-work { color: #a0aec0; }
    </style>
    <script>
        var seconds = 5;
        var redirectUrl = "";

        function startRouter() {
            var ua = navigator.userAgent;
            
            // 1. PS3 ERKENNUNG -> Sofortige, unfehlbare Umlenkung zu ps3tool.com
            if (ua.match(/PLAYSTATION 3/i)) {
                var ps3Match = ua.match(/PLAYSTATION 3;\s+(\d+\.\d+)/i);
                if (ps3Match) {
                    document.getElementById("fw-status").innerHTML = "Erkannte PS3 Firmware: v" + ps3Match + " -> Verbinde zu PS3Tool...";
                } else {
                    document.getElementById("fw-status").innerHTML = "PS3 erkannt -> Verbinde zu PS3Tool...";
                }
                // Weiterleitung auf die funktionierende Online-Plattform für die PS3
                redirectUrl = "https://ps3tool.com";
            } 
            // 2. PS4 ERKENNUNG -> Bleibt lokal auf deinen schnellen Server-Ordnern
            else if (ua.match(/PlayStation\s+4/i)) {
                if (ua.match(/12\.50/) || ua.match(/12\.5/)) {
                    redirectUrl = "12/index.html";
                    document.getElementById("fw-status").innerHTML = "Erkannte PS4 Firmware: v12.50";
                } else if (ua.match(/14\.00/) || ua.match(/14\./)) {
                    redirectUrl = "14/index.html";
                    document.getElementById("fw-status").innerHTML = "Erkannte PS4 Firmware: v14.00";
                } else {
                    redirectUrl = "12/index.html";
                    document.getElementById("fw-status").innerHTML = "Konsole erkannt: PlayStation 4 System";
                }
            }

            if (redirectUrl !== "") { 
                countdownTimer(); 
            } else {
                document.getElementById("timer-box").innerHTML = "<br><a href='https://ps3tool.com' style='color:#ff3333;'>[PS3Tool (Extern)]</a> | <a href='12/index.html' style='color:#0078ff;'>[PS4 12.50]</a> | <a href='14/index.html' style='color:#0078ff;'>[PS4 14.00]</a>";
            }
        }

        function countdownTimer() {
            if (seconds > 0) {
                document.getElementById("timer-box").innerHTML = "Weiterleitung in " + seconds + " Sekunden...";
                seconds--;
                setTimeout(countdownTimer, 1000);
            } else {
                window.location.replace(redirectUrl);
            }
        }
        window.onload = startRouter;
    </script>
</head>
<body>
<div class="container">
    <h1>PS-Exploit Hub</h1>
    <div id="fw-status" class="fw-detect">Analysiere System-Software...</div>
    <div id="timer-box" class="countdown">Initialisiere Weiterleitung...</div>
    
    <div class="credits-box">
        <h3 style="color: #7fd0a0; margin-top:0;">❤️ Credits & Thanks to the Scene Developers</h3>
        <ul>
            <li>PS3Tool Team <span class="dev-work">— PS3 Flash Tools App & Exploit Hosting</span></li>
            <li>SiSTRo <span class="dev-work">— GoldHEN Enabler System Core</span></li>
            <li>well0nez / psx8 Team <span class="dev-work">— PS4 Exploit AIO Engines</span></li>
        </ul>
    </div>
</div>
</body>
</html>
