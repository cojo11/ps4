<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS3 &amp; PS4 Hub</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 15px 30px;
      background-color: #0070d1;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .btn:hover { background-color: #005bb5; }
  </style>
</head>
<body>

  <h1>PS3 &amp; PS4 Hub</h1>
  <p id="status">Erkenne Konsole...</p>

  <!-- Manuelle Buttons als Fallback (für PC oder falls Auto-Redirect hakt) -->
  <div>
    <a class="btn" href="/ps4/ps3/">PS3 Exploit öffnen</a>
    <a class="btn" href="/ps4/ps4-host/">PS4 Exploit öffnen</a>
  </div>

  <script>
    (function() {
      var ua = navigator.userAgent || "";
      var statusEl = document.getElementById("status");

      // 1. Prüfung auf PlayStation 3
      if (ua.indexOf("PLAYSTATION 3") !== -1 || ua.indexOf("PlayStation 3") !== -1) {
        statusEl.innerText = "PS3 erkannt – leite weiter...";
        // Absoluter Pfad verhindert 404-Fehler durch fehlende Schrägstriche
        window.location.replace("/ps4/ps3/");
      } 
      // 2. Prüfung auf PlayStation 4
      else if (ua.indexOf("PlayStation 4") !== -1) {
        statusEl.innerText = "PS4 erkannt – leite weiter...";
        // Passe diesen Pfad an deinen PS4-Unterordner an:
        window.location.replace("/ps4/ps4-host/");
      } 
      // 3. Fallback für PC / Smartphone
      else {
        statusEl.innerText = "Kein PS3/PS4-Browser erkannt. Bitte manuell wählen:";
      }
    })();
  </script>

</body>
</html>
